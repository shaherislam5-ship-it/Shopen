<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>SHOPEN Admin</title><link rel="icon" href="/logo-icon.png">
<style>
:root{--bg:#000610;--p:#0a1322;--l:#1d2a40;--g:#d4a95a;--t:#eef1f6;--m:#8b97ab}
*{box-sizing:border-box;margin:0}html{background:var(--bg)}body{color:var(--t);font:14px/1.5 system-ui,sans-serif;min-height:100vh;background:radial-gradient(60vw 40vw at 10% -10%,rgba(212,169,90,.14),transparent),radial-gradient(50vw 40vw at 100% 30%,rgba(31,79,168,.16),transparent);background-attachment:fixed}
header{display:flex;align-items:center;gap:14px;padding:10px 20px;border-bottom:1px solid var(--l);flex-wrap:wrap;background:rgba(0,6,16,.7);backdrop-filter:blur(10px);position:sticky;top:0;z-index:5}header img{height:38px}
nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
button{cursor:pointer;font:inherit;border-radius:8px;border:1px solid var(--l);background:none;color:var(--t);padding:7px 14px}
button.on,.pri{background:var(--g);color:#1a1204;border-color:var(--g);font-weight:600}.del{color:#ff7b7b}
input,textarea,select{background:rgba(10,19,34,.9);border:1px solid var(--l);color:var(--t);border-radius:8px;padding:8px 10px;font:inherit;width:100%}input:focus,textarea:focus,select:focus{outline:2px solid var(--g)}
main{max-width:1100px;margin:auto;padding:20px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.stat,.box{background:rgba(10,19,34,.85);border:1px solid var(--l);border-radius:12px;padding:16px;margin-bottom:14px}.stat{margin:0}.stat b{display:block;font-size:24px;color:var(--g)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--l);vertical-align:top}th{color:var(--m);font-weight:500}
.tw{overflow-x:auto}.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#16294a;display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid2 .full{grid-column:1/-1}label{color:var(--m);font-size:12px;display:block;margin-bottom:3px}
.imgs{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}.imgs div{position:relative}.imgs img{width:90px;height:90px;object-fit:cover;border-radius:10px;border:1px solid var(--l)}.imgs button{position:absolute;top:2px;right:2px;padding:0 7px;background:#000a}
#login{max-width:340px;margin:14vh auto;display:grid;gap:12px;text-align:center}.err{color:#ff7b7b}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--g);color:#1a1204;padding:10px 18px;border-radius:8px;display:none;font-weight:600;z-index:9}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
</style></head><body>
<div id="login"><img src="/logo-full.png" alt="SHOPEN" style="width:100%"><h2>Admin sign in</h2><input type="password" id="pw" placeholder="Admin password" autocomplete="current-password"><button class="pri" id="lb">Sign in</button><div class="err" id="le"></div></div>
<div id="app" hidden><header><img src="/logo-icon.png" alt="SHOPEN"><b>SHOPEN Admin</b><nav id="nav"></nav></header><main id="main"></main></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);let tok=sessionStorage.tok||'',D=null,tab='Dashboard',E=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',1800)};
async function api(path,method='GET',body){const r=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:body?JSON.stringify(body):undefined});const j=await r.json();if(r.status===401&&path!=='login'){logout();throw 0}if(!r.ok)throw new Error(j.error);return j}
function logout(){sessionStorage.tok='';tok='';$('#app').hidden=true;$('#login').hidden=false}
async function boot(){try{D=await api('admin/data');$('#login').hidden=true;$('#app').hidden=false;draw()}catch(e){if(e)alert(e.message)}}
$('#lb').addEventListener('click',async()=>{try{tok=(await api('login','POST',{password:$('#pw').value})).token;sessionStorage.tok=tok;boot()}catch(e){$('#le').textContent=e.message}});
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('#lb').click()});
const cur=()=>D.settings.currency,money=n=>cur()+Number(n).toLocaleString('en-US');
const STAT=['Pending','Confirmed','Shipped','Delivered','Cancelled'];
function draw(){$('#nav').innerHTML=['Dashboard','Products','Orders','Coupons','Settings'].map(t=>`<button class="${t===tab?'on':''}" data-t="${t}">${t}</button>`).join('')+'<button id="out">Log out</button>';
$('#main').innerHTML={Dashboard:dash,Products:prods,Orders:orders,Coupons:coupons,Settings:sets}[tab]()}
function dash(){const rev=D.orders.filter(o=>o.status!=='Cancelled').reduce((s,o)=>s+o.total,0),low=D.products.filter(p=>p.stock<=5);
return`<div class="cards"><div class="stat"><b>${money(rev)}</b>Revenue</div><div class="stat"><b>${D.orders.length}</b>Orders</div><div class="stat"><b>${D.orders.filter(o=>o.status==='Pending').length}</b>Pending</div><div class="stat"><b>${D.products.length}</b>Products</div><div class="stat"><b>${low.length}</b>Low stock (≤5)</div></div>${low.length?`<div class="box"><h3>Low stock</h3>${low.map(p=>`<p>${esc(p.name)} <b class="err">${p.stock} left</b></p>`).join('')}</div>`:''}<div class="box"><h3>Recent orders</h3>${ordTable(D.orders.slice(0,5))}</div>`}
function prods(){if(E)return form();return`<div style="display:flex;justify-content:space-between;margin-bottom:12px"><h2>Products</h2><button class="pri" data-new>Add product</button></div><div class="box tw"><table><tr><th></th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th></th></tr>${D.products.map(p=>`<tr><td>${p.images&&p.images[0]?`<img class="thumb" src="${esc(p.images[0])}">`:'<div class="thumb"></div>'}</td><td>${esc(p.name)}${p.featured?' ★':''}</td><td>${esc(p.category)}</td><td>${money(p.price)}</td><td>${p.stock}</td><td>${p.active?'Live':'Hidden'}</td><td style="white-space:nowrap"><button data-edit="${p.id}">Edit</button> <button class="del" data-delp="${p.id}">Delete</button></td></tr>`).join('')}</table></div>`}
function form(){const p=E,I=(f,l,t='text')=>`<div><label>${l}</label><input data-f="${f}" type="${t}" value="${esc(p[f])}"></div>`,Y=(f,l)=>`<div><label>${l}</label><select data-f="${f}"><option value="1" ${p[f]?'selected':''}>Yes</option><option value="0" ${p[f]?'':'selected'}>No</option></select></div>`;
return`<h2 style="margin-bottom:12px">${p.id?'Edit product':'Add product'}</h2><div class="box grid2"><div class="full"><label>Name</label><input data-f="name" value="${esc(p.name)}"></div>${I('category','Category')}${I('brand','Brand')}${I('price','Price ('+cur()+')','number')}${I('oldPrice','Old price (optional, shows discount)','number')}${I('stock','Stock','number')}${I('badge','Badge (e.g. New, Sale)')}${Y('featured','Featured on home')}${Y('active','Live in store')}
<div class="full"><label>Description</label><textarea data-f="description" rows="4">${esc(p.description)}</textarea></div><div class="full"><label>Specifications (one per line, like  Battery: 30 hours)</label><textarea data-f="specs" rows="4">${esc(p.specs)}</textarea></div>
<div class="full"><label>Video link (YouTube link or direct .mp4 link)</label><input data-f="video" value="${esc(p.video)}" placeholder="https://youtube.com/watch?v=..."></div>
<div class="full"><label>Images (up to 8, first one is the main image)</label><div class="imgs">${p.images.map((u,i)=>`<div><img src="${esc(u)}" alt=""><button class="del" data-rm="${i}">×</button></div>`).join('')}</div><input type="file" id="files" accept="image/*" multiple><div style="display:flex;gap:8px;margin-top:8px"><input id="imgurl" placeholder="or paste image link"><button data-addurl>Add</button></div></div>
<div class="full"><button class="pri" id="savep">Save product</button> <button id="cancel">Cancel</button></div></div>`}
function ordTable(l){return l.length?`<div class="tw"><table><tr><th>Order</th><th>Customer</th><th>Items</th><th>Payment</th><th>Status</th></tr>${l.map(o=>`<tr><td><b>${o.id}</b><br><small>${new Date(o.date).toLocaleString()}</small></td><td>${esc(o.name)}<br>${esc(o.phone)}<br><small>${esc(o.address)}${o.note?'<br>Note: '+esc(o.note):''}</small></td><td>${o.items.map(i=>esc(i.name)+' × '+i.qty).join('<br>')}</td><td><b>${money(o.total)}</b><br>${esc(o.payment||'COD')}${o.trx?'<br>TrxID: '+esc(o.trx):''}${o.coupon?'<br><small>Coupon '+esc(o.coupon)+' (−'+money(o.discount)+')</small>':''}</td><td><select data-st="${o.id}">${STAT.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select><br><button class="del" data-delo="${o.id}" style="margin-top:6px">Delete</button></td></tr>`).join('')}</table></div>`:'<p style="color:var(--m)">No orders yet.</p>'}
const orders=()=>`<h2 style="margin-bottom:12px">Orders</h2><div class="box">${ordTable(D.orders)}</div>`;
const coupons=()=>`<h2 style="margin-bottom:12px">Coupons</h2><div class="box grid2"><div><label>Code</label><input id="c_code" placeholder="EID20"></div><div><label>Type</label><select id="c_type"><option value="percent">Percent %</option><option value="flat">Flat amount</option></select></div><div><label>Value</label><input id="c_value" type="number"></div><div><label>Minimum order</label><input id="c_min" type="number" value="0"></div><div class="full"><button class="pri" id="addc">Add coupon</button></div></div><div class="box tw"><table><tr><th>Code</th><th>Discount</th><th>Min order</th><th></th></tr>${D.coupons.map(c=>`<tr><td><b>${esc(c.code)}</b></td><td>${c.type==='percent'?c.value+'%':money(c.value)}</td><td>${money(c.min)}</td><td><button class="del" data-delc="${esc(c.code)}">Delete</button></td></tr>`).join('')}</table></div>`;
function sets(){const L={storeName:'Store name',tagline:'Tagline',heroTitle:'Home headline',heroText:'Home sub-text',currency:'Currency symbol',shipping:'Delivery charge',freeShippingOver:'Free delivery over',phone:'Phone',whatsapp:'WhatsApp number (with country code)',email:'Email',address:'Address',facebook:'Facebook page link',bkash:'bKash number',nagad:'Nagad number',notice:'Top banner message'};
return`<h2 style="margin-bottom:12px">Store settings</h2><div class="box grid2">${Object.keys(L).map(k=>`<div><label>${L[k]}</label><input data-s="${k}" value="${esc(D.settings[k])}"></div>`).join('')}<div class="full"><button class="pri" id="sets">Save settings</button></div></div>`}
function shrink(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const i=new Image();i.onerror=rej;i.onload=()=>{const m=900,k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.78))};i.src=r.result};r.readAsDataURL(file)})}
async function upload(files){for(const f of files){if(E.images.length>=8)break;try{E.images.push((await api('admin/upload','POST',{data:await shrink(f)})).url);toast('Image uploaded')}catch(x){alert((x&&x.message)||'Upload failed')}}draw()}
document.addEventListener('input',e=>{const t=e.target,f=t.dataset.f;if(f&&E&&t.tagName!=='SELECT')E[f]=t.value});
document.addEventListener('change',async e=>{const t=e.target,f=t.dataset.f;if(f&&E&&t.tagName==='SELECT')E[f]=t.value==='1';if(t.id==='files'&&E)upload(t.files);
if(t.dataset.st){try{D=await api('admin/orders/'+t.dataset.st,'PATCH',{status:t.value});toast('Status updated')}catch(x){alert(x.message)}}});
document.addEventListener('click',async e=>{const t=e.target,d=t.dataset;try{
if(d.t){tab=d.t;E=null;draw()}if(t.id==='out')logout();
if('new' in d){E={name:'',category:'',brand:'',price:'',oldPrice:'',stock:'',badge:'',featured:false,active:true,description:'',specs:'',images:[],video:''};draw()}
if(d.edit){E=JSON.parse(JSON.stringify(D.products.find(p=>p.id===d.edit)));E.images=E.images||[];draw()}if(t.id==='cancel'){E=null;draw()}
if(d.rm!==undefined){E.images.splice(+d.rm,1);draw()}if('addurl' in d){const v=$('#imgurl').value.trim();if(v&&E.images.length<8){E.images.push(v);draw()}}
if(d.delp&&confirm('Delete this product?')){D=await api('admin/products/'+d.delp,'DELETE');draw();toast('Deleted')}
if(d.delo&&confirm('Delete this order?')){D=await api('admin/orders/'+d.delo,'DELETE');draw();toast('Deleted')}
if(d.delc){D=await api('admin/coupons/'+d.delc,'DELETE');draw();toast('Deleted')}
if(t.id==='savep'){D=await api('admin/products','POST',E);E=null;draw();toast('Product saved')}
if(t.id==='addc'){D=await api('admin/coupons','POST',{code:$('#c_code').value,type:$('#c_type').value,value:$('#c_value').value,min:$('#c_min').value});draw();toast('Coupon added')}
if(t.id==='sets'){const b={};document.querySelectorAll('[data-s]').forEach(i=>b[i.dataset.s]=i.value);D=await api('admin/settings','PUT',b);toast('Settings saved')}
}catch(x){if(x)alert(x.message)}});
if(tok)boot();
</script></body></html>
