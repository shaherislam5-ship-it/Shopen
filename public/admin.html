<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>SHOPEN Admin</title><link rel="icon" href="logo.png">
<style>
:root{--bg:#000610;--panel:#0a1322;--line:#1d2a40;--gold:#d4a95a;--text:#eef1f6;--mute:#8b97ab}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:10px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}header img{height:40px;mix-blend-mode:lighten}
nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
button{cursor:pointer;font:inherit;border-radius:8px;border:1px solid var(--line);background:none;color:var(--text);padding:7px 14px}
button.on,.pri{background:var(--gold);color:#1a1204;border-color:var(--gold);font-weight:600}.del{color:#ff7b7b}
input,textarea,select{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font:inherit;width:100%}
main{max-width:1100px;margin:auto;padding:20px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.stat,.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}.stat b{display:block;font-size:24px;color:var(--gold)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mute);font-weight:500}
.tw{overflow-x:auto}.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#16294a;display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid2 .full{grid-column:1/-1}label{color:var(--mute);font-size:12px;display:block;margin-bottom:3px}
#login{max-width:340px;margin:18vh auto;display:grid;gap:12px;text-align:center}.err{color:#ff7b7b}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--gold);color:#1a1204;padding:10px 18px;border-radius:8px;display:none;font-weight:600}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
</style></head><body>
<div id="login"><img src="logo.png" alt="SHOPEN" style="width:100%;mix-blend-mode:lighten"><h2>Admin sign in</h2><input type="password" id="pw" placeholder="Admin password"><button class="pri" id="lb">Sign in</button><div class="err" id="le"></div></div>
<div id="app" hidden><header><img src="logo.png" alt="SHOPEN"><nav id="nav"></nav></header><main id="main"></main></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);let tok=sessionStorage.tok||'',D=null,tab='Dashboard',edit=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',1800)};
async function api(path,method='GET',body){const r=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:body?JSON.stringify(body):undefined});const j=await r.json();if(r.status===401&&path!=='login'){logout();throw 0}if(!r.ok)throw new Error(j.error);return j}
function logout(){sessionStorage.tok='';tok='';$('#app').hidden=true;$('#login').hidden=false}
async function boot(){try{D=await api('admin/data');$('#login').hidden=true;$('#app').hidden=false;draw()}catch(e){if(e)alert(e.message)}}
$('#lb').onclick=async()=>{try{tok=(await api('login','POST',{password:$('#pw').value})).token;sessionStorage.tok=tok;boot()}catch(e){$('#le').textContent=e.message}};
$('#pw').onkeydown=e=>e.key==='Enter'&&$('#lb').click();
const cur=()=>D.settings.currency,money=n=>cur()+Number(n).toLocaleString();
function draw(){$('#nav').innerHTML=['Dashboard','Products','Orders','Settings'].map(t=>`<button class="${t===tab?'on':''}" data-t="${t}">${t}</button>`).join('')+'<button id="out">Log out</button>';
$('#main').innerHTML={Dashboard:dash,Products:prods,Orders:orders,Settings:sets}[tab]()}
function dash(){const rev=D.orders.filter(o=>o.status!=='Cancelled').reduce((s,o)=>s+o.total,0);
return`<div class="cards"><div class="stat"><b>${money(rev)}</b>Revenue</div><div class="stat"><b>${D.orders.length}</b>Orders</div><div class="stat"><b>${D.orders.filter(o=>o.status==='Pending').length}</b>Pending</div><div class="stat"><b>${D.products.length}</b>Products</div><div class="stat"><b>${D.products.filter(p=>p.stock<=5).length}</b>Low stock (≤5)</div></div><div class="box"><h3>Recent orders</h3>${ordTable(D.orders.slice(0,5))}</div>`}
function prods(){if(edit)return form();return`<div style="display:flex;justify-content:space-between;margin-bottom:12px"><h2>Products</h2><button class="pri" data-edit="new">Add product</button></div><div class="box tw"><table><tr><th></th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th></th></tr>${D.products.map(p=>`<tr><td>${p.image?`<img class="thumb" src="${esc(p.image)}">`:'<div class="thumb"></div>'}</td><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td>${money(p.price)}</td><td>${p.stock}</td><td>${p.active?'Live':'Hidden'}</td><td style="white-space:nowrap"><button data-edit="${p.id}">Edit</button> <button class="del" data-delp="${p.id}">Delete</button></td></tr>`).join('')}</table></div>`}
function form(){const p=edit==='new'?{name:'',category:'',price:'',stock:'',description:'',image:'',active:true}:D.products.find(x=>x.id===edit);
return`<h2 style="margin-bottom:12px">${edit==='new'?'Add product':'Edit product'}</h2><div class="box grid2" id="pf"><div class="full"><label>Name</label><input id="f_name" value="${esc(p.name)}"></div><div><label>Category</label><input id="f_category" value="${esc(p.category)}"></div><div><label>Price (${cur()})</label><input id="f_price" type="number" min="0" value="${p.price}"></div><div><label>Stock</label><input id="f_stock" type="number" min="0" value="${p.stock}"></div><div><label>Visibility</label><select id="f_active"><option value="1" ${p.active?'selected':''}>Live in store</option><option value="0" ${p.active?'':'selected'}>Hidden</option></select></div><div class="full"><label>Description</label><textarea id="f_description" rows="3">${esc(p.description)}</textarea></div><div class="full"><label>Image URL, or upload a photo</label><input id="f_image" value="${p.image.startsWith('data:')?'':esc(p.image)}" placeholder="https://..."><input type="file" id="f_file" accept="image/*" style="margin-top:6px">${p.image?`<img id="prev" class="thumb" style="width:90px;height:90px;margin-top:8px" src="${esc(p.image)}">`:''}<input type="hidden" id="f_data" value="${p.image.startsWith('data:')?esc(p.image):''}"></div><div class="full"><button class="pri" id="savep" data-id="${edit==='new'?'':p.id}">Save product</button> <button id="cancel">Cancel</button></div></div>`}
function ordTable(l){return l.length?`<div class="tw"><table><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr>${l.map(o=>`<tr><td><b>${o.id}</b><br><small>${new Date(o.date).toLocaleString()}</small></td><td>${esc(o.name)}<br>${esc(o.phone)}<br><small>${esc(o.address)}${o.note?'<br>Note: '+esc(o.note):''}</small></td><td>${o.items.map(i=>esc(i.name)+' × '+i.qty).join('<br>')}</td><td>${money(o.total)}</td><td><select data-st="${o.id}">${['Pending','Confirmed','Shipped','Delivered','Cancelled'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select><br><button class="del" data-delo="${o.id}" style="margin-top:6px">Delete</button></td></tr>`).join('')}</table></div>`:'<p style="color:var(--mute)">No orders yet.</p>'}
function orders(){return`<h2 style="margin-bottom:12px">Orders</h2><div class="box">${ordTable(D.orders)}</div>`}
function sets(){const L={storeName:'Store name',tagline:'Tagline',currency:'Currency symbol',shipping:'Delivery charge',freeShippingOver:'Free delivery over',phone:'Phone',email:'Email',address:'Address',notice:'Top banner message'};
return`<h2 style="margin-bottom:12px">Store settings</h2><div class="box grid2">${Object.keys(L).map(k=>`<div><label>${L[k]}</label><input data-s="${k}" value="${esc(D.settings[k])}"></div>`).join('')}<div class="full"><button class="pri" id="sets">Save settings</button></div></div>`}
function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const m=600,k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};i.src=r.result};r.readAsDataURL(file)})}
document.addEventListener('change',async e=>{const t=e.target;
if(t.id==='f_file'&&t.files[0]){$('#f_data').value=await shrink(t.files[0]);$('#f_image').value='';toast('Photo ready – save the product')}
if(t.dataset.st){try{D=await api('admin/orders/'+t.dataset.st,'PATCH',{status:t.value});toast('Status updated')}catch(x){alert(x.message)}}});
document.addEventListener('click',async e=>{const t=e.target,d=t.dataset;try{
if(d.t){tab=d.t;edit=null;draw()}if(t.id==='out')logout();
if(d.edit){edit=d.edit;draw()}if(t.id==='cancel'){edit=null;draw()}
if(d.delp&&confirm('Delete this product?')){D=await api('admin/products/'+d.delp,'DELETE');draw();toast('Deleted')}
if(d.delo&&confirm('Delete this order?')){D=await api('admin/orders/'+d.delo,'DELETE');draw();toast('Deleted')}
if(t.id==='savep'){const v=k=>$('#f_'+k).value,b={id:d.id||undefined,name:v('name'),category:v('category'),price:v('price'),stock:v('stock'),description:v('description'),image:v('image')||v('data'),active:v('active')==='1'};D=await api('admin/products','POST',b);edit=null;draw();toast('Product saved')}
if(t.id==='sets'){const b={};document.querySelectorAll('[data-s]').forEach(i=>b[i.dataset.s]=i.value);D=await api('admin/settings','PUT',b);toast('Settings saved')}
}catch(x){if(x)alert(x.message)}});
if(tok)boot();
</script></body></html>
